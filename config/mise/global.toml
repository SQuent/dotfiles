[tools]
python                    = "3.14.7"
golang                    = "1.27.1"
terraform                 = "1.16.4"
terragrunt                = "1.1.6"
opentofu                  = "latest"
kubectl                   = "1.37.1"
helm                      = "4.3.0"
minikube                  = "1.39.0"
awscli                    = "2.37.5"
packer                    = "1.16.1"
uv                        = "0.12.19"
"pipx:poetry"             = "2.5.1"
pre-commit                = "4.6.2"
tflint                    = "0.64.0"
act                       = "0.2.89"
glab                      = "1.119.0"
fnox                      = "1.36.0"
bitwarden-secrets-manager = "2.1.0"
rclone                    = "1.75.1"
terraform-docs            = "0.24.0"

# Example of how to install a Python CLI tool via pipx
# pipx                      = "1.16.1"
# "pipx:jrnl"               = "4.3"

# Only tools whose description isn't resolvable via `mise registry <name> --json`
# need an entry here
[_.descriptions]
golang                    = "Go programming language"

[settings]
experimental = true
not_found_auto_install = true 
trusted_config_paths = ["~/git/work", "~/git/nas", "~/git/github", "~/git/gitlab"]  # Recursive prefix

[env]
GIT_SSH_COMMAND = "ssh -i ~/.ssh/github_id_rsa -F /dev/null"
RCLONE_CONFIG_DBX_TYPE = "dropbox"

[hooks]
cd = """
if [ "$PWD" = "$HOME" ]; then
  mise install
  exit 0
fi

ROOT=$(git rev-parse --show-toplevel 2>/dev/null) || exit 0

if [ "$ROOT" != "$PWD" ]; then
  exit 0
fi

if [ -f mise.toml ] || [ -f .tool-versions ]; then
    mise install
fi

if [ -f .pre-commit-config.yaml ] || [ -f .pre-commit-config.yml ]; then
  HOOK=$(git rev-parse --git-path hooks/pre-commit)

  if [ ! -f "$HOOK" ]; then
    echo "Installing pre-commit hook in $ROOT"
    pre-commit install
  fi
fi
"""