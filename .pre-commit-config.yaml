repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.0
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      # `nix develop -c` rather than bare commands: the toolbox is declared in
      # flake.nix (devShells.default), so hooks need nothing installed or
      # loaded beforehand.
      - id: python_export
        name: python export packages to doc
        entry: nix develop -c python docs/extract_packages.py
        always_run: true
        pass_filenames: false
        language: system
      - id: gomplate
        name: gomplate render README.md
        entry: nix develop -c gomplate -f docs/README.tpl -d nix_packages=./docs/nix_packages.yml -d mise_packages=./docs/mise_packages.yml -o README.md
        language: system
        verbose: true
        always_run: true
        pass_filenames: false
      - id: nixfmt
        name: nix fmt (nixfmt-tree / nixfmt-rfc-style)
        entry: nix fmt --
        language: system
        types: [nix]
      - id: deadnix
        name: deadnix (dead Nix code)
        entry: nix run .#deadnix --
        language: system
        types: [nix]
        args: ["--fail"]
