repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.0
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: python_export
        name: python export packages to doc
        entry: nix develop -c python docs/extract_packages.py
        pass_filenames: false
        language: system
        files: '(\.nix|flake\.lock|config/mise/global\.toml|docs/README\.tpl)$'
      - id: gomplate
        name: gomplate render README.md
        entry: nix develop -c gomplate -f docs/README.tpl -d nix_packages=./docs/nix_packages.yml -d mise_packages=./docs/mise_packages.yml -o README.md
        language: system
        verbose: true
        pass_filenames: false
        files: '(\.nix|flake\.lock|config/mise/global\.toml|docs/README\.tpl)$'
      - id: nixfmt
        name: nix fmt (nixfmt-tree / nixfmt-rfc-style)
        entry: nix fmt --
        language: system
        types: [nix]
      - id: deadnix
        name: deadnix (dead Nix code)
        entry: nix run .#deadnix --
        language: system
        types: [nix]
        args: ["--fail"]
